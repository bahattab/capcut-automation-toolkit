name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Install Windows package
        run: python -m pip install -e ".[test]"
      - name: Run backend and safety regressions
        run: python -m pytest -q --junitxml=test-results.xml
